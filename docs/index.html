<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>22G101视频播放</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
video{max-width:100%;max-height:100vh}
</style>
</head>
<body>
<video id="v" controls playsinline></video>
<script>
const params=new URLSearchParams(location.search);
const f=params.get('f');
if(f){
  const v=document.getElementById('v');
  v.src=f;
  v.poster='';
  document.title=decodeURIComponent(f.split('/').pop().replace('.mp4',''));
}
</script>
</body>
</html>
